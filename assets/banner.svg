<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38b2ac" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="pillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.25" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="4" y="4" width="912" height="232" rx="16" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Ambient Light Blobs -->
  <circle cx="820" cy="40" r="90" fill="#38bdf8" opacity="0.12" filter="url(#glowCyan)" />
  <circle cx="100" cy="200" r="110" fill="#10b981" opacity="0.14" filter="url(#glowEmerald)" />

  <!-- Code Dots (macOS style) -->
  <circle cx="32" cy="30" r="5.5" fill="#ef4444" />
  <circle cx="48" cy="30" r="5.5" fill="#f59e0b" />
  <circle cx="64" cy="30" r="5.5" fill="#10b981" />

  <text x="86" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="500">
    ashith@portfolio: ~/developer_profile.py
  </text>

  <!-- Status Badge (Right) -->
  <g transform="translate(620, 20)">
    <rect x="0" y="0" width="270" height="28" rx="14" fill="url(#pillGradient)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="14" cy="14" r="4.5" fill="#10b981" />
    <text x="26" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#34d399" font-weight="600" letter-spacing="0.2">
      MCA Graduate • Immediate Joiner
    </text>
  </g>

  <!-- Main Headline -->
  <text x="32" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#titleGradient)" letter-spacing="-0.5">
    Ashith Sanjay Rao
  </text>

  <!-- Subtitle -->
  <text x="32" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e2e8f0" letter-spacing="0.2">
    MCA Graduate | Full-Stack Python &amp; Backend Engineer
  </text>

  <text x="32" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8">
    Specializing in high-performance backends, zero-trust RESTful APIs, and algorithmic systems.
  </text>

  <!-- Tags Badges Row -->
  <g transform="translate(32, 190)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="82" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="41" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#38bdf8" font-weight="600" text-anchor="middle">FastAPI</text>

    <!-- Tag 2 -->
    <rect x="92" y="0" width="80" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="132" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#38bdf8" font-weight="600" text-anchor="middle">Python</text>

    <!-- Tag 3 -->
    <rect x="182" y="0" width="80" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="222" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#38bdf8" font-weight="600" text-anchor="middle">Django</text>

    <!-- Tag 4 -->
    <rect x="272" y="0" width="70" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="307" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#38bdf8" font-weight="600" text-anchor="middle">Flask</text>

    <!-- Tag 5 -->
    <rect x="352" y="0" width="86" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="395" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#38bdf8" font-weight="600" text-anchor="middle">React.js</text>

    <!-- Tag 6 -->
    <rect x="448" y="0" width="105" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="500.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#38bdf8" font-weight="600" text-anchor="middle">SQLAlchemy</text>

    <!-- Tag 7 -->
    <rect x="563" y="0" width="125" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="625.5" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#34d399" font-weight="600" text-anchor="middle">DSA in Python 🧮</text>
  </g>
</svg>
